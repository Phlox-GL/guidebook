name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Check canonical source and formal toolchain
        run: |
          set -euo pipefail
          test ! -e compact.cirru
          test ! -e package.cirru
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only --all-defs --format json

      - name: Select frontend CDN path
        id: assets
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            asset_prefix="${GITHUB_REPOSITORY}/"
          fi
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=${CDN_ORIGIN}/${asset_prefix}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          CDN_BASE: ${{ steps.assets.outputs.base-url }}
        run: |
          calcit calcit.cirru js
          yarn vite build --base="$CDN_BASE"

      - name: Install verified mdBook binaries
        run: |
          install -d "$RUNNER_TEMP/mdbook-bin"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/mdbook.tar.gz" \
            https://github.com/rust-lang/mdBook/releases/download/v0.4.14/mdbook-v0.4.14-x86_64-unknown-linux-gnu.tar.gz
          echo "0ed75f6e4115f02d806932c4b1a8d9aca276ea1bbc3979524b4a8847bd3510e4  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/linkcheck.zip" \
            https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.6/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
          echo "2c478d9754e38be2dbd3ee2fcac629179c6d6146f7e0f1749a5a697030e27c4a  $RUNNER_TEMP/linkcheck.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/linkcheck.zip" -d "$RUNNER_TEMP/mdbook-bin"
          chmod +x "$RUNNER_TEMP/mdbook-bin/mdbook" "$RUNNER_TEMP/mdbook-bin/mdbook-linkcheck"
          echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build mdBook
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.assets.outputs.base-url }}
        run: |
          mdbook build
          mv book/html/index.html book/html/mdbook.html

      - name: Check current production revision
        id: production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload and verify web assets on COS
        if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist/assets
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.assets.outputs.prefix }}assets/
          public-base-url: ${{ steps.assets.outputs.base-url }}assets/
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Upload and verify mdBook on COS
        if: steps.production.outputs.current == 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: book/html
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.assets.outputs.prefix }}
          public-base-url: ${{ steps.assets.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}

      - name: Deploy frontend to original server directory
        if: steps.production.outputs.current == 'true'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: dist/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

      - name: Deploy mdBook to original server directory
        if: steps.production.outputs.current == 'true'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: -avzr --progress
          options: ""
          ssh_options: ""
          src: book/html/*
          dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}
